<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Gestão de Biblioteca</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f7f9fa; color: #333; }
        .container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); max-width: 650px; margin: 0 auto; }
        h1 { color: #2c3e50; }
        p { color: #555; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 25px; }
        .btn-card { display: block; padding: 15px; background-color: #3498db; color: #fff; text-decoration: none; border-radius: 6px; font-weight: bold; text-align: center; }
        .btn-card:hover { background-color: #2980b9; }
        .btn-card.secondary { background-color: #8e44ad; }
        .btn-card.secondary:hover { background-color: #732d91; }
    </style>
</head>
<body>
    <div class="container">
        <h1 th:text="${nomeSistema}">Sistema de Gestão de Biblioteca</h1>
        <p th:text="${mensagemBoasVindas}">Bem-vindo ao sistema de controle de acervo e empréstimos!</p>

        <div class="menu-grid">
            <a href="/livros" class="btn-card">Gerenciar Livros</a>
            <a href="/autores" class="btn-card">Gerenciar Autores</a>
            <a href="/categorias" class="btn-card">Gerenciar Categorias</a>
            <a href="/usuarios" class="btn-card">Gerenciar Usuários</a>
            <a href="/emprestimos" class="btn-card secondary">Gerenciar Empréstimos</a>
            <a href="/livros/detalhes" class="btn-card secondary">Exemplo Completo</a>
        </div>
    </div>
</body>
</html>
