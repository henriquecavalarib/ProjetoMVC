<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Biblioteca</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f7f9fa; color: #333; }
        .container { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); max-width: 600px; }
        h1 { color: #2c3e50; }
        p { color: #555; }
        .btn { display: inline-block; padding: 10px 18px; background-color: #3498db; color: #fff; text-decoration: none; border-radius: 4px; font-weight: bold; margin-top: 15px; }
        .btn:hover { background-color: #2980b9; }
    </style>
</head>
<body>
    <div class="container">
        <h1 th:text="${nomeSistema}">Sistema de Gestão de Biblioteca</h1>
        <p th:text="${mensagemBoasVindas}">Bem-vindo ao sistema de controle de acervo e empréstimos!</p>

        <a href="/livro" class="btn">Visualizar Livro e Empréstimo</a>
    </div>
</body>
</html>
