<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Início - Livros</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f7f9fa; color: #333; }
        .container { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); max-width: 600px; }
        h1 { color: #2c3e50; }
        p { color: #555; }
        .btn { display: inline-block; padding: 10px 18px; background-color: #3498db; color: #fff; text-decoration: none; border-radius: 4px; font-weight: bold; margin-right: 10px; margin-top: 15px; }
        .btn:hover { background-color: #2980b9; }
        .btn-secondary { background-color: #95a5a6; }
        .btn-secondary:hover { background-color: #7f8c8d; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gestão de Livros</h1>
        <p>Área de controle do acervo de livros da biblioteca.</p>
        <a href="/livros" class="btn">Listar e Cadastrar Livros</a>
        <a href="/livros/detalhes" class="btn">Exemplo Completo</a>
        <a href="/" class="btn btn-secondary">Início</a>
    </div>
</body>
</html>
