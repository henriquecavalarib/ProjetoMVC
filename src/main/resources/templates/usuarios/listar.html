<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Usuários</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f7f9fa; color: #333; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-bottom: 25px; }
        h1, h2 { color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #34495e; }
        input[type="text"], input[type="email"], select { width: 100%; padding: 8px 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #27ae60; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #219150; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #ddd; }
        th { background-color: #f4f6f7; color: #2c3e50; }
        .empty-message { color: #7f8c8d; font-style: italic; }
        .nav-links { margin-bottom: 20px; }
        .nav-links a { margin-right: 15px; color: #3498db; text-decoration: none; font-weight: bold; }
        .nav-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-links">
            <a href="/">&larr; Início</a>
            <a href="/livros">Livros</a>
            <a href="/autores">Autores</a>
            <a href="/categorias">Categorias</a>
            <a href="/emprestimos">Empréstimos</a>
        </div>

        <div class="card">
            <h2>Cadastrar Novo Usuário</h2>
            <form th:action="@{/usuarios}" method="post">
                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required />
                </div>
                <div class="form-group">
                    <label for="matricula">Matrícula / RA:</label>
                    <input type="text" id="matricula" name="matricula" required />
                </div>
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required />
                </div>
                <div class="form-group">
                    <label for="telefone">Telefone:</label>
                    <input type="text" id="telefone" name="telefone" />
                </div>
                <div class="form-group">
                    <label for="tipo">Tipo de Membro:</label>
                    <select id="tipo" name="tipo">
                        <option value="Aluno">Aluno</option>
                        <option value="Professor">Professor</option>
                        <option value="Membro">Membro</option>
                    </select>
                </div>
                <button type="submit">Cadastrar Usuário</button>
            </form>
        </div>

        <div class="card">
            <h2>Usuários Cadastrados</h2>
            <div th:if="${usuarios == null or #lists.isEmpty(usuarios)}" class="empty-message">
                Nenhum usuário cadastrado até o momento.
            </div>
            <table th:if="${usuarios != null and not #lists.isEmpty(usuarios)}">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Matrícula</th>
                        <th>E-mail</th>
                        <th>Telefone</th>
                        <th>Tipo</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td th:text="${usuario.nome}">Nome</td>
                        <td th:text="${usuario.matricula}">Matrícula</td>
                        <td th:text="${usuario.email}">E-mail</td>
                        <td th:text="${usuario.telefone}">Telefone</td>
                        <td th:text="${usuario.tipo}">Tipo</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
