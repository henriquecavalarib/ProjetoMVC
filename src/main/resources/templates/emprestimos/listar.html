<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Empréstimos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f7f9fa; color: #333; }
        .container { max-width: 850px; margin: 0 auto; }
        .card { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-bottom: 25px; }
        h1, h2 { color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #34495e; }
        input[type="text"], input[type="date"] { width: 100%; padding: 8px 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #27ae60; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #219150; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #ddd; }
        th { background-color: #f4f6f7; color: #2c3e50; }
        .badge { display: inline-block; padding: 4px 8px; background-color: #27ae60; color: #fff; border-radius: 4px; font-size: 0.85em; font-weight: bold; }
        .empty-message { color: #7f8c8d; font-style: italic; }
        .nav-links { margin-bottom: 20px; }
        .nav-links a { margin-right: 15px; color: #3498db; text-decoration: none; font-weight: bold; }
        .nav-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-links">
            <a href="/">&larr; Início</a>
            <a href="/livros">Livros</a>
            <a href="/autores">Autores</a>
            <a href="/categorias">Categorias</a>
            <a href="/usuarios">Usuários</a>
        </div>

        <div class="card">
            <h2>Registrar Novo Empréstimo</h2>
            <form th:action="@{/emprestimos}" method="post">
                <div class="form-group">
                    <label for="livroTitulo">Título do Livro:</label>
                    <input type="text" id="livroTitulo" name="livro.titulo" required />
                </div>
                <div class="form-group">
                    <label for="usuarioNome">Nome do Aluno / Membro:</label>
                    <input type="text" id="usuarioNome" name="usuario.nome" required />
                </div>
                <div class="form-group">
                    <label for="dataRetirada">Data de Retirada:</label>
                    <input type="date" id="dataRetirada" name="dataRetirada" />
                </div>
                <div class="form-group">
                    <label for="dataPrevistaDevolucao">Data Prevista de Devolução:</label>
                    <input type="date" id="dataPrevistaDevolucao" name="dataPrevistaDevolucao" />
                </div>
                <button type="submit">Registrar Empréstimo</button>
            </form>
        </div>

        <div class="card">
            <h2>Empréstimos Registrados</h2>
            <div th:if="${emprestimos == null or #lists.isEmpty(emprestimos)}" class="empty-message">
                Nenhum empréstimo registrado até o momento.
            </div>
            <table th:if="${emprestimos != null and not #lists.isEmpty(emprestimos)}">
                <thead>
                    <tr>
                        <th>Livro</th>
                        <th>Usuário</th>
                        <th>Retirada</th>
                        <th>Devolução Prevista</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="emp : ${emprestimos}">
                        <td th:text="${emp.livro != null ? emp.livro.titulo : 'Sem título'}">Livro</td>
                        <td th:text="${emp.usuario != null ? emp.usuario.nome : 'Sem usuário'}">Usuário</td>
                        <td th:text="${emp.dataRetirada}">Retirada</td>
                        <td th:text="${emp.dataPrevistaDevolucao}">Devolução</td>
                        <td><span class="badge" th:text="${emp.status}">Ativo</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
